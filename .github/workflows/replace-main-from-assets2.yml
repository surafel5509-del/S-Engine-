name: Replace main with Assets2 arena/50d2e64e-assets2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-project:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Clone exact Assets2 source branch outside the target workspace
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 'arena/50d2e64e-assets2' https://github.com/surafel5509-del/Assets2.git "$RUNNER_TEMP/Assets2-source"
      - name: Replace project files while preserving target workflow permissions
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/' "$RUNNER_TEMP/Assets2-source/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source tree already matches main; nothing to commit."
            exit 0
          fi
          git commit -m "Replace main with Assets2 arena/50d2e64e-assets2 [skip ci]"
          git push --force origin HEAD:main
