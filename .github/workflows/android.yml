name: Build S Engine APK

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 34 platform and build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/gradle-test.log"

      - name: Assemble debug and release APKs
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle-apk.log"

      - name: Publish Gradle failure details
        if: failure()
        run: |
          python3 - "$RUNNER_TEMP/gradle-test.log" "$RUNNER_TEMP/gradle-apk.log" <<'PY'
          import glob
          import os
          import re
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          summary = []
          for filename in sys.argv[1:]:
              path = Path(filename)
              if not path.exists():
                  continue
              lines = path.read_text(errors="replace").splitlines()
              pattern = re.compile(r"(^e: |error:|\* What went wrong:|FAILURE:|Execution failed for task|FAILED|AssertionError|Exception|^Caused by:|Could not find|Could not resolve|daemon disappeared)", re.I)
              matches = [line.strip() for line in lines if pattern.search(line)]
              if not matches:
                  matches = lines[-25:]
              summary.extend(f"{path.name}: {line[:600]}" for line in matches[-25:])

          for filename in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              try:
                  root = ET.parse(filename).getroot()
                  for case in root.iter("testcase"):
                      for failure in list(case.findall("failure")) + list(case.findall("error")):
                          body = (failure.text or "").strip()
                          detail = failure.get("message") or (body.splitlines()[0] if body else "test failed")
                          summary.append(f"JUnit {case.get('classname')}.{case.get('name')}: {detail[:800]}")
              except (ET.ParseError, OSError):
                  pass

          summary = list(dict.fromkeys(summary))[-40:]
          if not summary:
              summary = ["Gradle failed; no diagnostic log or JUnit report was produced."]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as report:
              report.write("## Gradle failure details\n\n")
              for line in summary:
                  report.write(f"- `{line.replace('`', chr(39))}`\n")

          for line in summary:
              message = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Gradle failure::{message}")
          PY

      - name: Upload Gradle diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: SEngine-Gradle-Diagnostics
          path: |
            ${{ runner.temp }}/gradle-test.log
            ${{ runner.temp }}/gradle-apk.log
            app/build/test-results/testDebugUnitTest/**/*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload installable engine APKs
        uses: actions/upload-artifact@v7
        with:
          name: SEngine-Android-APKs
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
